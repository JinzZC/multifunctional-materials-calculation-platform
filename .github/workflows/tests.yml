name: Tests

on:
  push:
    branches: ["main", "master"]
  pull_request:

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      PYTHONIOENCODING: utf-8
      PY_PYTHON3: "3.14"
      MPLBACKEND: Agg
      QT_QPA_PLATFORM: offscreen
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
      - name: Verify Python version
        run: py -3 -c "import sys; assert sys.version_info[:2] == (3, 14), sys.version; print(sys.version)"
      - name: Install dependencies
        run: py -3 -m pip install -r requirements.txt -r requirements-dev.txt
      - name: Run unit tests
        run: py -3 -m pytest tests/ -q
      - name: Run isolated UI smoke test
        run: py -3 scripts/smoke_ui.py
